name: Release

# Release automation for the npm package, in two stages (mirrors
# nexus-exchange-ts's release.yml, adapted npm-for-pnpm):
#
#   1. release-please watches main. Conventional-commit history is accumulated
#      into a "release PR" that bumps the version + CHANGELOG. Nothing publishes
#      while that PR sits open. Merging it is the human gate: release-please then
#      tags the commit and cuts a GitHub release, setting release_created=true.
#
#   2. Only on that release commit, the publish job re-runs the full CI gate and
#      publishes to npm with provenance.
#
# Security posture:
#   - Default-deny permissions at the top; each job is granted only what it needs.
#   - No long-lived npm secret: the publish job authenticates via OIDC trusted
#     publishing (a trusted publisher registered on npmjs.com for this repo +
#     workflow). npm exchanges the Actions OIDC token for a short-lived
#     credential at publish time -- nothing to leak, and it satisfies
#     require-2FA-on-publish. Runs only on a release commit or manual dispatch,
#     never on PRs (a fork PR can't assume this repo's OIDC subject anyway).
#   - Provenance (--provenance + id-token: write) signs the published tarball so
#     consumers can verify it was built from this repo at this commit.
#   - npm ci installs exactly the lockfile; the registry rejects re-publishing an
#     existing version, so a re-run can't clobber a release.

on:
  push:
    branches: [main]
  # Manual re-publish of an already-cut tag (e.g. when the automatic
  # publish job failed after release-please created the release). Publishes
  # the given existing tag to npm; the registry rejects clobbering an
  # already-published version, so this is safe to retry.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish to npm, e.g. v0.2.0"
        required: true
        type: string

# Default-deny; jobs opt into the minimum they need.
permissions: {}

# Serialize releases and never cancel a publish mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Push-only: a workflow_dispatch re-publish must not re-run release-please
    # against main, where it could open or update a release PR as a byproduct.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag + GitHub release
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `!cancelled()` supplies the status-check function that stops GitHub from
    # implying success() over `needs` — without it, publish is skipped whenever
    # release-please is skipped or failing, which is exactly when the manual
    # re-publish hatch needs to work. `!cancelled()` not `always()`, so a
    # cancelled run doesn't go on to publish.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm uses to attest provenance
    environment: npm-publish # optional manual-approval / secret-scoping gate
    steps:
      # `ref:` below would otherwise accept any ref, so a dispatch of `main`
      # would publish from HEAD rather than a released tag. Constrain the input
      # to what it claims to be. Passed via env, never interpolated into the
      # script body. Shape only — `refs/tags/` below constrains the kind.
      - name: Validate dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::tag must be a released v<major>.<minor>.<patch> tag, got '$TAG'"
            exit 1
          fi
          echo "publishing tag $TAG"

      - uses: actions/checkout@v7
        with:
          # Fully qualified: checkout fetches heads as well as tags for a bare
          # name (`+refs/heads/v0.2.0*` alongside `+refs/tags/v0.2.0*`), so a
          # branch named like a version would be a candidate ref. release-please
          # emits a bare `v0.2.0`, and the guard above rejects a pre-qualified
          # input, so this can't double up.
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
          # This job holds a publish credential and never pushes; don't leave
          # the Actions token sitting in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Re-run the full gate on the exact commit being published — the bytes we
      # publish are the bytes we verified.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Sanity-check the tarball contents (dist + bin entries present).
      - run: npm pack --dry-run

      # Publish via OIDC trusted publishing -- no long-lived npm secret. With a
      # trusted publisher registered on npmjs.com for this repo + workflow
      # (release.yml, environment npm-publish) and `id-token: write` above, npm
      # exchanges the Actions OIDC token for a short-lived, 2FA-satisfying
      # publish credential. Trusted publishing needs npm >= 11.5.1; Node 22
      # bundles npm 10.x, so upgrade the CLI first. Pinned to the capability
      # floor rather than `@latest`: this is the step holding a publish
      # credential, and a bad npm release shouldn't land in it unannounced.
      #   --provenance:    signed build-provenance attestation.
      #   --access public: a scoped @nexus-xyz/ package is private by default.
      - run: npm install -g "npm@^11.5.1"
      - run: npm publish --provenance --access public
